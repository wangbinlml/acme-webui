services:
  acme-manager:
    build: .
    image: acme-manager:latest
    container_name: acme-manager
    restart: unless-stopped
    ports:
      # Web UI 只绑定本机；如需局域网访问请改成 "28080:3000"，并用反向代理加认证
      - "127.0.0.1:28080:3000"
      # HTTP-01 standalone 验证需要宿主机 80 端口空闲且公网可达；默认不占用（DNS-01 不需要）。
      # 需要 HTTP-01 时取消下行注释（80 被占用会报 bind: address already in use）
      # - "80:80"
    environment:
      - TZ=Asia/Shanghai
      # 每天凌晨 3 点扫描续期（可改，如 "30 4 * * *"）
      # - RENEW_CRON=0 3 * * *
      # 证书详情页的「宿主机路径」默认自动识别上方 ./storage 挂载；识别不准时可显式指定，如：
      # - HOST_STORAGE_DIR=/srv/acme-manager/storage
    volumes:
      # SQLite 数据库（证书配置 / DNS 凭据 / 日志）
      - ./data:/app/data
      # 签发好的证书文件（fullchain.pem / privkey.pem ...）
      - ./storage:/app/storage
      # acme.sh 自身目录（账户、ACME 状态），与宿主机 ~/.acme.sh 互不影响
      - ./acme.sh:/app/acme.sh
      # ── 证书自动部署（按需取消注释）──
      # 复制式部署：把宿主目录挂进容器，Web UI「自动部署」目标目录填 /deploy/nginx-certs，
      # 证书会出现在宿主机 ./deploy/nginx-certs/<域名>/，供宿主机 nginx 等直接引用
      # - ./deploy:/deploy
      # 容器化 nginx/Caddy 自动 reload：挂载 docker socket（部署方式选「Docker 容器」）
      # - /var/run/docker.sock:/var/run/docker.sock
